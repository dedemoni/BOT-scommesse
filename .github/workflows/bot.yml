name: Run Betting Bot

on:
  schedule:
    # Esegue il bot due volte al giorno (es. alle 09:00 e alle 15:00 UTC)
    - cron: '0 11,16 * * *'
  workflow_dispatch: # Permette anche l'esecuzione manuale da GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Autorizzazione necessaria per fare il push del file di stato

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Esecuzione dello Script Bot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bot.py

      - name: Salvataggio dello Stato (Commit e Push di tracked_bets.json)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tracked_bets.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: aggiornato stato scommesse [skip ci]" && git push)
