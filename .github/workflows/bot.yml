name: Betting Bot Monitor

on:
  schedule:
    # Esegue il bot ogni ora (es. alle ore 00:00, 01:00, 02:00, ecc.)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Permette di avviarlo a mano quando vuoi con un clic

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Bot Script
      env:
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        python bot.py

    - name: Commit and push updated tracked_bets.json (State)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.io"
        git add tracked_bets.json || true
        git commit -m "Aggiornato stato scommesse automatico [skip ci]" || true
        git push || true
